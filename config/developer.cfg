/* Compiled developer tools. Edit, then rebuild the game. */
#ifndef DKC2_DEVELOPER_CFG
#define DKC2_DEVELOPER_CFG

#ifndef DKC2_DEVELOPER_ENABLED
#define DKC2_DEVELOPER_ENABLED 1
#endif
/* Function key number: 8 = F8; 0 disables the shortcut. */
#define DKC2_DEVELOPER_BEAT_LEVEL_KEY 8

#if DKC2_DEVELOPER_ENABLED != 0 && DKC2_DEVELOPER_ENABLED != 1
#error "Developer ENABLED must be 0 or 1"
#endif
#if DKC2_DEVELOPER_BEAT_LEVEL_KEY < 0 || DKC2_DEVELOPER_BEAT_LEVEL_KEY > 12
#error "Beat level shortcut must be 0 (disabled) or a function key from 1 to 12"
#endif
#endif
