/* Compiled co-op gameplay tuning. Edit these values, then rebuild the game.
 * Distances are native game pixels. Zero stomp distances require exact overlap.
 * NTSC timing rounds the Select hold up to a complete console frame. */
#ifndef DKC2_COOP_TUNING_CFG
#define DKC2_COOP_TUNING_CFG

#define DKC2_COOP_SELECT_HOLD_MS 2000
#define DKC2_COOP_STOMP_HORIZONTAL_PX 32
#define DKC2_COOP_STOMP_VERTICAL_PX 32

#if DKC2_COOP_SELECT_HOLD_MS < 1 || DKC2_COOP_SELECT_HOLD_MS > 60000
#error "Select hold must be between 1 and 60000 milliseconds"
#endif
#if DKC2_COOP_STOMP_HORIZONTAL_PX < 0 || DKC2_COOP_STOMP_HORIZONTAL_PX > 256
#error "Shared stomp horizontal distance must be between 0 and 256 pixels"
#endif
#if DKC2_COOP_STOMP_VERTICAL_PX < 0 || DKC2_COOP_STOMP_VERTICAL_PX > 128
#error "Shared stomp vertical distance must be between 0 and 128 pixels"
#endif
#endif
