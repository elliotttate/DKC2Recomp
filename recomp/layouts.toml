schema_version = 1
rom_revision = "DKC2 USA v1.0 (headerless)"

# Objects use canonical memory-space addresses. WRAM offsets are independent
# of their SNES mirror bank, so diagnostics use WRAM:OOOO rather than 7E:OOOO.

[[object]]
address = "WRAM:0024"
name = "g_game_mode"
constant = "DKC2_GAME_MODE"
type = "u16"
size = 2
confidence = "confirmed"
tags = ["attract", "game-state", "screen-profile"]
provenance = "Two-cycle attract regression and validated revision map"
note = "Top-level game-mode continuation used by attract transition diagnostics."

