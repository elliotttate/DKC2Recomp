# Donkey Kong Country 2: Diddy's Kong Quest (USA v1.0)
#
# Minimum LLE-first seed. The supported private ROM's architectural vectors
# identify RESET=$00:83F7, NMI=$00:F37D, and IRQ=$00:F3B9. These values are
# independently read from the ROM header by dkc2_verify.

bank = 0

# Seed RESET and native NMI/IRQ directly from the ROM's vector table.
auto_vectors

# A missing AOT body must execute through the interpreter tier. It must never
# silently no-op merely because this intentionally small configuration has not
# promoted the target yet.
tier_down_stubs
